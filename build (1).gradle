
 // Top-level build file for Harsh's Olympiad Lab

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}

// Dependency repositories are configured in settings.gradle.
// Do not add project-level repositories here.

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
